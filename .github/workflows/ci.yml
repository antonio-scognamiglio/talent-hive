# =============================================================================
# CI — Continuous Integration per TalentHive
# =============================================================================
# Questo file dice a GitHub: "quando succede X, avvia una macchina virtuale
# e esegui questi comandi". Tu non ti serve un server Ubuntu: lo fornisce GitHub.
#
# Dove lo vedi: repo su GitHub → tab "Actions"
# =============================================================================

# Nome del workflow (appare nella UI di GitHub Actions)
name: CI

# -----------------------------------------------------------------------------
# WHEN — quando far partire il workflow
# -----------------------------------------------------------------------------
on:
  # Push diretto su main (es. dopo un merge, o se qualcuno pusha su main)
  push:
    branches: [main]

  # Apertura / aggiornamento di una Pull Request verso main
  # Ogni nuovo commit sul branch della PR fa ripartire i check
  pull_request:
    branches: [main]

# -----------------------------------------------------------------------------
# JOBS — uno o più lavori (possono girare in parallelo)
# -----------------------------------------------------------------------------
jobs:
  # Un solo job per iniziare: install + typecheck + lint (+ build)
  check:
    name: Lint & Typecheck
    # Immagine della VM: Ubuntu gestito da GitHub (non la tua macchina)
    runs-on: ubuntu-latest

    steps:
      # --- 1. Scarica il codice del commit/PR nella VM ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 2. Installa Bun (package manager del monorepo) ---
      # "uses:" richiama un'action già pronta (come un plugin)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- 3. Installa le dipendenze (frontend + backend via workspaces) ---
      # --frozen-lockfile: fallisce se bun.lock non è allineato (buona pratica in CI)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- 4. Typecheck frontend (stesso comando di husky in locale) ---
      - name: Typecheck frontend
        run: bun run typecheck:frontend

      # --- 5. Typecheck backend ---
      - name: Typecheck backend
        run: bun run typecheck:backend

      # --- 6. ESLint sul frontend ---
      - name: Lint frontend
        run: bun run --filter frontend lint

      # --- 7. Build di produzione frontend (opzionale ma utile in CI) ---
      # Verifica che Vite riesca a compilare il bundle; non fa deploy
      - name: Build frontend
        run: bun run --filter frontend build
